# Supabase local dev config
# Run `supabase start` to spin up a local Postgres instance.
# Run `supabase db push` to apply migrations to your remote project.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://cardpromo.lk"]
jwt_expiry = 3600
enable_signup = false   # Admin accounts created manually only

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
