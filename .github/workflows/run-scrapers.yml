name: Run Promotion Scrapers

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  schedule:
    # 18:30 UTC daily = midnight Sri Lanka time (UTC+5:30)
    # Adjust the cron if you want a different time.
    # To temporarily disable the schedule without deleting this file,
    # comment out the `schedule:` block below.
    - cron: "30 18 * * *"

  # Allow admins to run the scraper on-demand from the Actions tab
  workflow_dispatch:

# ── Prevent concurrent runs ──────────────────────────────────────────────────
concurrency:
  group: scrapers
  cancel-in-progress: false   # let an in-progress run finish before cancelling

# ── Job ──────────────────────────────────────────────────────────────────────
jobs:
  scrape:
    name: Scrape bank promotions
    runs-on: ubuntu-latest
    timeout-minutes: 30      # kill the job if it hangs

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python runtime ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip downloads keyed to requirements.txt so re-installs are fast
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          echo "=== Installing scraper dependencies ==="
          pip install --upgrade pip --quiet
          pip install -r scrapers/requirements.txt
          echo "=== Dependencies installed ==="

      # ── 3b. Playwright Chromium ───────────────────────────────────────────
      # Required by SampathScraper as a JS-rendering fallback when cloudscraper
      # cannot bypass Cloudflare protection.
      # The binary (~500 MB) is cached after the first run.
      # To disable (saves ~2 min): comment out this step — the scraper will
      # log a clear warning and skip Sampath rather than crashing.
      - name: Install Playwright Chromium browser
        run: python -m playwright install --with-deps chromium

      # ── 4. Secret validation ──────────────────────────────────────────────
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -z "$SUPABASE_URL" ]               && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]  && missing+=("SUPABASE_SERVICE_ROLE_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub secrets: ${missing[*]}"
            echo ""
            echo "Fix: GitHub repo → Settings → Secrets and variables"
            echo "     → Actions → New repository secret"
            exit 1
          fi

          echo "Secrets validated OK."

      # ── 5. Run scraper ────────────────────────────────────────────────────
      - name: Run scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== CardPromo LK scraper starting ($(date -u '+%Y-%m-%dT%H:%M:%SZ')) ==="
          cd scrapers
          python main.py
          echo "=== Scraper finished ($(date -u '+%Y-%m-%dT%H:%M:%SZ')) ==="

      # ── 5b. Cleanup expired offers + candidates ───────────────────────────
      # Deletes records whose valid_to is more than 7 days in the past.
      # Runs even if the scraper failed — we still want to prune stale data.
      - name: Clean up expired records
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== Cleanup starting ($(date -u '+%Y-%m-%dT%H:%M:%SZ')) ==="
          cd scrapers
          python cleanup_expired.py
          echo "=== Cleanup finished ($(date -u '+%Y-%m-%dT%H:%M:%SZ')) ==="

      # ── 5c. Trigger site rebuild (Cloudflare Pages deploy hook) ───────────
      # Rebuilds the public site after a successful scrape so that:
      #   • newly auto-published offers get their own prerendered page with the
      #     correct self-referential canonical + meta (fixes the GSC
      #     "Alternative page with proper canonical" issue, where non-prerendered
      #     offers fall back to index.html and inherit the homepage canonical);
      #   • expired offers drop out of the prerender + sitemap.
      # Skipped automatically if the deploy-hook secret is not configured.
      - name: Trigger site rebuild
        if: success()
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL not set — skipping site rebuild."
            echo "Add it: Cloudflare Pages → Settings → Builds & deployments →"
            echo "        Deploy hooks (branch: main), then save the URL as the"
            echo "        GitHub secret CLOUDFLARE_DEPLOY_HOOK_URL."
            exit 0
          fi
          echo "Triggering Cloudflare Pages rebuild…"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deploy hook responded HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "ERROR: deploy hook returned non-2xx ($status) — rebuild not queued."
            exit 1
          fi
          echo "Rebuild queued successfully."

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Scraper run summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow run | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review new candidates: Admin → Review Candidates" >> "$GITHUB_STEP_SUMMARY"
